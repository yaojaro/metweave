<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>metweave · 公开气象报文可视化</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="map-legend" hidden aria-label="预报状态图例">
      <span class="lg-item"><i style="background: #2f9e63"></i>良好</span>
      <span class="lg-item"><i style="background: #d99a2b"></i>注意</span>
      <span class="lg-item"><i style="background: #c2504a"></i>差</span>
      <span class="lg-item"><i style="background: #94a3b8"></i>无数据</span>
    </div>
    <aside id="taf-panel" hidden aria-label="站点预报列表">
      <h3 id="taf-panel-title">站点预报</h3>
      <table>
        <thead>
          <tr>
            <th>档</th>
            <th>站点</th>
            <th>下一变化</th>
          </tr>
        </thead>
        <tbody id="taf-panel-body"></tbody>
      </table>
    </aside>
    <div id="mode-bar" role="tablist" aria-label="演示模式">
      <button type="button" id="mode-metar" class="mode-btn active" aria-pressed="true">
        METAR 实况
      </button>
      <button type="button" id="mode-taf" class="mode-btn" aria-pressed="false">TAF 预报</button>
      <button type="button" id="mode-list" class="mode-btn" aria-pressed="false" hidden>
        站点列表
      </button>
      <button
        type="button"
        id="tz-btn"
        class="mode-btn"
        aria-pressed="false"
        title="当前显示 UTC，点击切换为北京时"
      >
        UTC
      </button>
    </div>
    <div id="basemap-hint" role="note" hidden></div>
    <aside id="panel" role="alert" hidden></aside>
    <!-- TAF 时间轴（owner 9/24 时间轴批）：现在起 24h、10 分钟一格，默认锚「现在」；拖动全图按该时刻重渲级别 -->
    <div id="taf-timeline" hidden aria-label="预报时间轴">
      <span class="tl-now" title="时间轴起点＝当前时刻">现在</span>
      <div class="tl-ctrl"></div>
    </div>
    <footer id="disclaimer">
      演示用途：数据来自公开通路（IEM / NOAA 等），按现状提供、无 SLA，可能延迟或缺失；
      本页及本库均<strong>不得用于飞行决策或任何运行决策</strong>。圆点色仅为扫视参考，
      非标准分级。本演示与 IEM、NOAA/NWS、天地图均无隶属或背书关系。
    </footer>
    <div id="status" role="status" aria-live="polite" hidden>
      <span id="status-spinner" aria-hidden="true"></span>
      <span id="status-text"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
